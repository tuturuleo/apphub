<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%%PROJECT_NAME%%</title>
    <style>
      :root { color-scheme: light dark; --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #2563eb; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --accent: #60a5fa; } }
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
      main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
      .muted { color: var(--muted); }
      .error { color: #dc2626; }
      form { display: flex; gap: 8px; margin: 24px 0; }
      input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
      button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: white; font: inherit; cursor: pointer; }
      ul { list-style: none; padding: 0; }
      li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
      li span { overflow-wrap: anywhere; }
      li button { background: transparent; color: var(--muted); padding: 4px 10px; }
    </style>
  </head>
  <body>
    <main>
      <h1>%%PROJECT_NAME%%</h1>
      <p class="muted" id="status">Python + FastAPI в Docker на Render, заметки хранятся в Postgres (Supabase).</p>
      <form id="form">
        <input id="text" placeholder="Новая заметка" autocomplete="off" maxlength="1000" required />
        <button type="submit">Добавить</button>
      </form>
      <ul id="notes"></ul>
    </main>
    <script type="module">
      const list = document.getElementById("notes");
      const form = document.getElementById("form");
      const input = document.getElementById("text");
      const status = document.getElementById("status");

      async function api(method, path, body) {
        const res = await fetch(path, {
          method,
          headers: body ? { "Content-Type": "application/json" } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
        if (!res.ok) throw new Error(`Ошибка ${res.status}`);
        return res.status === 204 ? null : res.json();
      }

      function fail(error) {
        status.textContent = error.message;
        status.className = "error";
      }

      async function load() {
        try {
          const notes = await api("GET", "/api/notes");
          list.replaceChildren(
            ...notes.map((note) => {
              const li = document.createElement("li");
              const text = document.createElement("span");
              text.textContent = note.text;
              const del = document.createElement("button");
              del.textContent = "×";
              del.title = "Удалить";
              del.onclick = () => api("DELETE", `/api/notes/${note.id}`).then(load, fail);
              li.append(text, del);
              return li;
            }),
          );
        } catch (e) {
          fail(e);
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          await api("POST", "/api/notes", { text: input.value });
          input.value = "";
          load();
        } catch (err) {
          fail(err);
        }
      });

      load();
    </script>
  </body>
</html>
